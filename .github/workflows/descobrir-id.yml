name: Descobrir ID do Instagram

on:
  workflow_dispatch:

jobs:
  descobrir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar ID
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python descobrir_id.py
